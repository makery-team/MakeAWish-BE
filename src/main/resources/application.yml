spring:
  h2:
    console:
      enabled: true
      path: /h2-console
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    # 💡 Hibernate가 테이블을 다 만든 뒤에 SQL을 실행하게 순서를 늦춥니다.
    defer-datasource-initialization: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.H2Dialect
        # 💡 Hibernate 6에서 JSON 타입을 문자열로 강제 변환합니다.
        type:
          json_format: STRING

  sql:
    init:
      mode: always
      # 💡 혹시 지울 테이블이 없어도 에러 내지 말고 넘어가게 합니다.
      continue-on-error: true